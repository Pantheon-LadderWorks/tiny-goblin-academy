<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sprite Box Annotator</title>
<style>
  :root {
    --bg: #111827;
    --panel: #1f2937;
    --panel2: #0f172a;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #38bdf8;
    --danger: #fb7185;
    --ok: #86efac;
    --warn: #facc15;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  body {
    display: grid;
    grid-template-columns: 1fr 380px;
  }
  #stageWrap {
    position: relative;
    overflow: auto;
    background:
      linear-gradient(45deg, #555 25%, transparent 25%),
      linear-gradient(-45deg, #555 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #555 75%),
      linear-gradient(-45deg, transparent 75%, #555 75%);
    background-size: 32px 32px;
    background-position: 0 0, 0 16px, 16px -16px, -16px 0px;
    background-color: #777;
  }
  #stage {
    position: relative;
    width: max-content;
    height: max-content;
    min-width: 100%;
    min-height: 100%;
    transform-origin: top left;
  }
  #img {
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    image-rendering: auto;
  }
  .box {
    position: absolute;
    border: 2px solid var(--accent);
    background: rgba(56, 189, 248, 0.08);
    cursor: move;
  }
  .box.selected {
    border-color: var(--warn);
    background: rgba(250, 204, 21, 0.10);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 18px rgba(250,204,21,.35);
  }
  .box.bad { border-color: var(--danger); background: rgba(251,113,133,.08); }
  .box.good { border-color: var(--ok); background: rgba(134,239,172,.08); }
  .box .label {
    position: absolute;
    left: -2px;
    top: -24px;
    min-width: 22px;
    padding: 2px 6px;
    background: #020617;
    color: #fff;
    border-radius: 4px 4px 0 0;
    font-size: 12px;
    white-space: nowrap;
  }
  .handle {
    position: absolute;
    width: 10px;
    height: 10px;
    right: -6px;
    bottom: -6px;
    border-radius: 50%;
    background: var(--warn);
    border: 1px solid #111;
    cursor: nwse-resize;
  }
  #rubber {
    position: absolute;
    border: 2px dashed #fff;
    background: rgba(255,255,255,.08);
    pointer-events: none;
    display: none;
  }
  aside {
    overflow: auto;
    background: var(--panel2);
    border-left: 1px solid rgba(255,255,255,.12);
    padding: 14px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 20px;
    color: #93c5fd;
  }
  .hint { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row > * { flex: 1; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
  input, textarea, button, select {
    width: 100%;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px;
    background: #111827;
    color: var(--text);
    padding: 8px;
    font: inherit;
  }
  input[type=file] { padding: 7px; }
  input[type=checkbox] { width: auto; }
  button {
    cursor: pointer;
    background: #2563eb;
    border-color: #3b82f6;
    font-weight: 650;
  }
  button.secondary { background: #374151; border-color: #4b5563; }
  button.danger { background: #9f1239; border-color: #e11d48; }
  button.ok { background: #166534; border-color: #22c55e; }
  button:hover { filter: brightness(1.1); }
  textarea {
    min-height: 230px;
    resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
  }
  .boxList {
    max-height: 260px;
    overflow: auto;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px;
    margin: 8px 0;
  }
  .boxItem {
    display: grid;
    grid-template-columns: 42px 1fr 70px;
    gap: 6px;
    align-items: center;
    padding: 7px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    cursor: pointer;
  }
  .boxItem:hover { background: rgba(255,255,255,.06); }
  .boxItem.selected { background: rgba(250,204,21,.12); }
  .pill {
    display:inline-block;
    padding: 2px 6px;
    border-radius: 999px;
    background:#334155;
    color:#cbd5e1;
    font-size: 11px;
  }
  .mini {
    font-size: 12px;
    color: var(--muted);
  }
  .sep { height: 1px; background: rgba(255,255,255,.12); margin: 12px 0; }
  .coords {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
</style>
</head>
<body>
  <main id="stageWrap">
    <div id="stage">
      <img id="img" alt="" />
      <div id="rubber"></div>
    </div>
  </main>

  <aside>
    <h1>Sprite Box Annotator</h1>
    <div class="hint">
      Load a sheet, drag boxes, then copy JSON for Codex. Coordinates are source-image pixels, not screen pixels.
      <br><b>Keys:</b> Del deletes selected · Esc clears selection · Arrow keys nudge · Shift+arrows resize.
    </div>

    <label>Image file</label>
    <input id="file" type="file" accept="image/*" />

    <div class="row">
      <button id="fit" class="secondary">Fit</button>
      <button id="one" class="secondary">100%</button>
      <button id="copy" class="ok">Copy JSON</button>
    </div>

    <div class="row">
      <button id="add" class="secondary">Add box</button>
      <button id="dup" class="secondary">Duplicate</button>
      <button id="del" class="danger">Delete</button>
    </div>

    <div class="row mini">
      <label style="margin:0;"><input id="snap" type="checkbox" checked /> Snap</label>
      <label style="margin:0;"><input id="showLabels" type="checkbox" checked /> Labels</label>
      <label style="margin:0;"><input id="includeMeta" type="checkbox" checked /> Metadata</label>
    </div>

    <div class="row">
      <div>
        <label>Snap px</label>
        <input id="snapPx" type="number" min="1" value="1" />
      </div>
      <div>
        <label>Zoom</label>
        <input id="zoom" type="number" min="0.05" max="4" step="0.05" value="1" />
      </div>
    </div>

    <div class="sep"></div>

    <label>Selected box</label>
    <input id="name" placeholder="name / id, e.g. hut-small" />
    <div class="coords">
      <div><label>x</label><input id="x" type="number"></div>
      <div><label>y</label><input id="y" type="number"></div>
      <div><label>w</label><input id="w" type="number"></div>
      <div><label>h</label><input id="h" type="number"></div>
    </div>
    <label>status</label>
    <select id="status">
      <option value="candidate">candidate</option>
      <option value="approved">approved</option>
      <option value="needs-fix">needs-fix</option>
      <option value="denied">denied</option>
    </select>
    <label>notes</label>
    <input id="notes" placeholder="overflow, glow risk, good crop, etc." />

    <div class="sep"></div>

    <label>Boxes</label>
    <div id="boxList" class="boxList"></div>

    <label>JSON output / import</label>
    <textarea id="json"></textarea>
    <div class="row">
      <button id="refresh" class="secondary">Refresh JSON</button>
      <button id="import" class="secondary">Import JSON</button>
    </div>
  </aside>

<script>
const $ = (id) => document.getElementById(id);

const els = {
  stageWrap: $("stageWrap"), stage: $("stage"), img: $("img"), rubber: $("rubber"),
  file: $("file"), fit: $("fit"), one: $("one"), copy: $("copy"), add: $("add"), dup: $("dup"), del: $("del"),
  snap: $("snap"), showLabels: $("showLabels"), includeMeta: $("includeMeta"), snapPx: $("snapPx"), zoom: $("zoom"),
  name: $("name"), x: $("x"), y: $("y"), w: $("w"), h: $("h"), status: $("status"), notes: $("notes"),
  boxList: $("boxList"), json: $("json"), refresh: $("refresh"), import: $("import")
};

let boxes = [];
let selectedId = null;
let imgName = "";
let imgW = 0, imgH = 0;
let zoom = 1;
let drag = null;

function uid() {
  return "box-" + Math.random().toString(36).slice(2, 9);
}

function snapVal(v) {
  if (!els.snap.checked) return Math.round(v);
  const s = Math.max(1, Number(els.snapPx.value) || 1);
  return Math.round(v / s) * s;
}

function clampBox(b) {
  b.x = Math.max(0, Math.min(imgW, Math.round(b.x)));
  b.y = Math.max(0, Math.min(imgH, Math.round(b.y)));
  b.w = Math.max(1, Math.min(imgW - b.x, Math.round(b.w)));
  b.h = Math.max(1, Math.min(imgH - b.y, Math.round(b.h)));
}

function setZoom(z) {
  zoom = Math.max(0.05, Math.min(4, Number(z) || 1));
  els.zoom.value = zoom.toFixed(2).replace(/\.00$/, "");
  els.stage.style.transform = `scale(${zoom})`;
  els.stage.style.width = imgW + "px";
  els.stage.style.height = imgH + "px";
}

function fitZoom() {
  if (!imgW || !imgH) return;
  const pad = 40;
  const zw = (els.stageWrap.clientWidth - pad) / imgW;
  const zh = (els.stageWrap.clientHeight - pad) / imgH;
  setZoom(Math.min(1, zw, zh));
}

function stagePoint(e) {
  const rect = els.stage.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / zoom,
    y: (e.clientY - rect.top) / zoom
  };
}

function selectBox(id) {
  selectedId = id;
  const b = boxes.find(b => b.id === id);
  if (b) {
    els.name.value = b.name || "";
    els.x.value = b.x;
    els.y.value = b.y;
    els.w.value = b.w;
    els.h.value = b.h;
    els.status.value = b.status || "candidate";
    els.notes.value = b.notes || "";
  } else {
    els.name.value = els.x.value = els.y.value = els.w.value = els.h.value = els.notes.value = "";
    els.status.value = "candidate";
  }
  render();
}

function statusClass(status) {
  if (status === "approved") return "good";
  if (status === "needs-fix" || status === "denied") return "bad";
  return "";
}

function render() {
  [...els.stage.querySelectorAll(".box")].forEach(n => n.remove());

  for (const b of boxes) {
    const div = document.createElement("div");
    div.className = `box ${statusClass(b.status)} ${b.id === selectedId ? "selected" : ""}`;
    div.style.left = b.x + "px";
    div.style.top = b.y + "px";
    div.style.width = b.w + "px";
    div.style.height = b.h + "px";
    div.dataset.id = b.id;

    if (els.showLabels.checked) {
      const lab = document.createElement("div");
      lab.className = "label";
      lab.textContent = b.name || String(boxes.indexOf(b) + 1);
      div.appendChild(lab);
    }

    const handle = document.createElement("div");
    handle.className = "handle";
    div.appendChild(handle);

    div.addEventListener("mousedown", (e) => {
      e.stopPropagation();
      selectBox(b.id);
      const p = stagePoint(e);
      drag = {
        type: e.target.classList.contains("handle") ? "resize" : "move",
        id: b.id,
        start: p,
        base: { ...b }
      };
    });

    els.stage.appendChild(div);
  }

  renderList();
  refreshJson();
}

function renderList() {
  els.boxList.innerHTML = "";
  boxes.forEach((b, i) => {
    const item = document.createElement("div");
    item.className = "boxItem" + (b.id === selectedId ? " selected" : "");
    item.innerHTML = `
      <div><span class="pill">${i + 1}</span></div>
      <div>
        <div>${escapeHtml(b.name || b.id)}</div>
        <div class="mini">x:${b.x} y:${b.y} w:${b.w} h:${b.h}</div>
      </div>
      <div class="mini">${escapeHtml(b.status || "candidate")}</div>
    `;
    item.onclick = () => selectBox(b.id);
    els.boxList.appendChild(item);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function exportData() {
  const regions = boxes.map((b, i) => ({
    id: b.name || `region-${i + 1}`,
    x: b.x, y: b.y, w: b.w, h: b.h,
    status: b.status || "candidate",
    notes: b.notes || ""
  }));
  if (!els.includeMeta.checked) return regions;
  return {
    image: { name: imgName, width: imgW, height: imgH },
    regions
  };
}

function refreshJson() {
  els.json.value = JSON.stringify(exportData(), null, 2);
}

function updateSelectedFromInputs() {
  const b = boxes.find(b => b.id === selectedId);
  if (!b) return;
  b.name = els.name.value.trim();
  b.x = Number(els.x.value) || 0;
  b.y = Number(els.y.value) || 0;
  b.w = Number(els.w.value) || 1;
  b.h = Number(els.h.value) || 1;
  b.status = els.status.value;
  b.notes = els.notes.value;
  clampBox(b);
  render();
}

["name","x","y","w","h","status","notes"].forEach(id => {
  els[id].addEventListener("input", updateSelectedFromInputs);
  els[id].addEventListener("change", updateSelectedFromInputs);
});

els.file.addEventListener("change", () => {
  const f = els.file.files[0];
  if (!f) return;
  imgName = f.name;
  const url = URL.createObjectURL(f);
  els.img.onload = () => {
    imgW = els.img.naturalWidth;
    imgH = els.img.naturalHeight;
    els.stage.style.width = imgW + "px";
    els.stage.style.height = imgH + "px";
    fitZoom();
    render();
  };
  els.img.src = url;
});

els.stage.addEventListener("mousedown", (e) => {
  if (!imgW || e.target !== els.img && e.target !== els.stage) return;
  const p = stagePoint(e);
  drag = {
    type: "create",
    start: { x: snapVal(p.x), y: snapVal(p.y) },
    current: { x: snapVal(p.x), y: snapVal(p.y) }
  };
  els.rubber.style.display = "block";
});

window.addEventListener("mousemove", (e) => {
  if (!drag) return;
  const p = stagePoint(e);

  if (drag.type === "create") {
    drag.current = { x: snapVal(p.x), y: snapVal(p.y) };
    const x = Math.min(drag.start.x, drag.current.x);
    const y = Math.min(drag.start.y, drag.current.y);
    const w = Math.abs(drag.current.x - drag.start.x);
    const h = Math.abs(drag.current.y - drag.start.y);
    Object.assign(els.rubber.style, { left:x+"px", top:y+"px", width:w+"px", height:h+"px" });
    return;
  }

  const b = boxes.find(b => b.id === drag.id);
  if (!b) return;

  if (drag.type === "move") {
    b.x = snapVal(drag.base.x + (p.x - drag.start.x));
    b.y = snapVal(drag.base.y + (p.y - drag.start.y));
  } else if (drag.type === "resize") {
    b.w = snapVal(drag.base.w + (p.x - drag.start.x));
    b.h = snapVal(drag.base.h + (p.y - drag.start.y));
  }
  clampBox(b);
  if (b.id === selectedId) {
    els.x.value = b.x; els.y.value = b.y; els.w.value = b.w; els.h.value = b.h;
  }
  render();
});

window.addEventListener("mouseup", () => {
  if (!drag) return;

  if (drag.type === "create") {
    els.rubber.style.display = "none";
    const x = Math.min(drag.start.x, drag.current.x);
    const y = Math.min(drag.start.y, drag.current.y);
    const w = Math.abs(drag.current.x - drag.start.x);
    const h = Math.abs(drag.current.y - drag.start.y);
    if (w >= 4 && h >= 4) {
      const b = { id: uid(), name: "", x, y, w, h, status: "candidate", notes: "" };
      clampBox(b);
      boxes.push(b);
      selectBox(b.id);
    }
  }

  drag = null;
  render();
});

function addBox() {
  const b = {
    id: uid(),
    name: "",
    x: Math.round((els.stageWrap.scrollLeft / zoom) + 40),
    y: Math.round((els.stageWrap.scrollTop / zoom) + 40),
    w: 128,
    h: 128,
    status: "candidate",
    notes: ""
  };
  clampBox(b);
  boxes.push(b);
  selectBox(b.id);
}

els.add.onclick = addBox;
els.dup.onclick = () => {
  const b = boxes.find(b => b.id === selectedId);
  if (!b) return;
  const copy = { ...b, id: uid(), name: b.name ? b.name + "-copy" : "", x: b.x + 12, y: b.y + 12 };
  clampBox(copy);
  boxes.push(copy);
  selectBox(copy.id);
};
els.del.onclick = () => {
  if (!selectedId) return;
  boxes = boxes.filter(b => b.id !== selectedId);
  selectBox(boxes[0]?.id || null);
};
els.fit.onclick = fitZoom;
els.one.onclick = () => setZoom(1);
els.zoom.onchange = () => setZoom(els.zoom.value);
els.showLabels.onchange = render;
els.includeMeta.onchange = refreshJson;
els.refresh.onclick = refreshJson;
els.copy.onclick = async () => {
  refreshJson();
  await navigator.clipboard.writeText(els.json.value);
  const old = els.copy.textContent;
  els.copy.textContent = "Copied!";
  setTimeout(() => els.copy.textContent = old, 900);
};
els.import.onclick = () => {
  try {
    const data = JSON.parse(els.json.value);
    const regions = Array.isArray(data) ? data : data.regions;
    if (!Array.isArray(regions)) throw new Error("No regions array found");
    boxes = regions.map((r, i) => ({
      id: uid(),
      name: r.id || r.name || `region-${i+1}`,
      x: Number(r.x) || 0,
      y: Number(r.y) || 0,
      w: Number(r.w ?? r.width) || 1,
      h: Number(r.h ?? r.height) || 1,
      status: r.status || "candidate",
      notes: r.notes || ""
    }));
    boxes.forEach(clampBox);
    selectBox(boxes[0]?.id || null);
  } catch (err) {
    alert("Import failed: " + err.message);
  }
};

window.addEventListener("keydown", (e) => {
  const b = boxes.find(b => b.id === selectedId);
  if (["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;

  if (e.key === "Escape") { selectBox(null); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && b) {
    e.preventDefault();
    boxes = boxes.filter(x => x.id !== b.id);
    selectBox(boxes[0]?.id || null);
    return;
  }
  if (!b) return;

  const step = e.altKey ? 10 : 1;
  let changed = true;

  if (e.shiftKey) {
    if (e.key === "ArrowLeft") b.w -= step;
    else if (e.key === "ArrowRight") b.w += step;
    else if (e.key === "ArrowUp") b.h -= step;
    else if (e.key === "ArrowDown") b.h += step;
    else changed = false;
  } else {
    if (e.key === "ArrowLeft") b.x -= step;
    else if (e.key === "ArrowRight") b.x += step;
    else if (e.key === "ArrowUp") b.y -= step;
    else if (e.key === "ArrowDown") b.y += step;
    else changed = false;
  }

  if (changed) {
    e.preventDefault();
    clampBox(b);
    selectBox(b.id);
  }
});

refreshJson();
</script>
</body>
</html>
