<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topdown-slime-v2-idle-move Flipbook</title>
    <style>
        body {
            background-color: #121418;
            color: #e1e6f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #fff4cc;
            margin-bottom: 8px;
        }
        p {
            color: #b4c8dc;
            margin-top: 0;
            margin-bottom: 24px;
        }
        .canvas-container {
            background-color: #181a20;
            border: 2px solid #2d3340;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            min-width: 300px;
        }
        canvas {
            background-color: #181a20;
            image-rendering: pixelated;
            max-width: 100%;
        }
        .controls {
            display: flex;
            gap: 16px;
            background-color: #1f222a;
            padding: 16px 24px;
            border-radius: 8px;
            border: 1px solid #2d3340;
            align-items: center;
        }
        select, button, input {
            background-color: #2d3340;
            color: #e1e6f0;
            border: 1px solid #404859;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        select:focus, button:hover, input:focus {
            border-color: #78b4ff;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            background-color: #3b4252;
        }
        button:hover {
            background-color: #4c566a;
        }
        .fps-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #fps-value {
            width: 24px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <h1>topdown-slime-v2-idle-move Flipbook</h1>
    <p>Interactive sequence viewer &mdash; Draft Review</p>
    
    <div class="canvas-container">
        <canvas id="viewer"></canvas>
    </div>
    
    <div class="controls">
        <select id="seq-select"></select>
        <div id="action-buttons" style="display: flex; gap: 8px; border-left: 1px solid #404859; padding-left: 16px; border-right: 1px solid #404859; padding-right: 16px;"></div>
        <button id="play-btn">Pause</button>
        <div class="fps-control">
            <label for="fps-slider">FPS:</label>
            <input type="range" id="fps-slider" min="1" max="30" value="10">
            <span id="fps-value">10</span>
        </div>
    </div>

    <script>
        const manifest = {"domain": "topdown-slime-v2-idle-move", "operationalType": "character-animation-sheet", "sourceSheet": "assets/academy/creatures/slime/tga-topdown-slime-v2-idle-move.png", "derivedSheet": "assets/academy/creatures/slime/tga-topdown-slime-v2-idle-move-cleaned.png", "animations": [{"id": "idle.down", "label": "Idle.down", "rowIndex": 0, "frameCount": 4, "loop": true, "reviewStatus": "Draft", "frames": [{"index": 0, "sourceRect": {"x": 51, "y": 88, "w": 322, "h": 268}}, {"index": 1, "sourceRect": {"x": 475, "y": 88, "w": 322, "h": 268}}, {"index": 2, "sourceRect": {"x": 899, "y": 88, "w": 322, "h": 268}}, {"index": 3, "sourceRect": {"x": 1323, "y": 88, "w": 323, "h": 268}}]}, {"id": "idle.up", "label": "Idle.up", "rowIndex": 1, "frameCount": 4, "loop": true, "reviewStatus": "Draft", "frames": [{"index": 0, "sourceRect": {"x": 50, "y": 511, "w": 323, "h": 269}}, {"index": 1, "sourceRect": {"x": 475, "y": 511, "w": 322, "h": 269}}, {"index": 2, "sourceRect": {"x": 899, "y": 511, "w": 322, "h": 269}}, {"index": 3, "sourceRect": {"x": 1323, "y": 511, "w": 323, "h": 269}}]}, {"id": "idle.right", "label": "Idle.right", "rowIndex": 2, "frameCount": 4, "loop": true, "reviewStatus": "Draft", "frames": [{"index": 0, "sourceRect": {"x": 51, "y": 934, "w": 321, "h": 269}}, {"index": 1, "sourceRect": {"x": 475, "y": 934, "w": 322, "h": 269}}, {"index": 2, "sourceRect": {"x": 900, "y": 934, "w": 321, "h": 269}}, {"index": 3, "sourceRect": {"x": 1324, "y": 934, "w": 321, "h": 269}}]}, {"id": "idle.left", "label": "Idle.left", "rowIndex": 2, "frameCount": 4, "loop": true, "reviewStatus": "Draft", "flipX": true, "frames": [{"index": 0, "sourceRect": {"x": 51, "y": 934, "w": 321, "h": 269}}, {"index": 1, "sourceRect": {"x": 475, "y": 934, "w": 322, "h": 269}}, {"index": 2, "sourceRect": {"x": 900, "y": 934, "w": 321, "h": 269}}, {"index": 3, "sourceRect": {"x": 1324, "y": 934, "w": 321, "h": 269}}]}, {"id": "walk.down", "label": "Walk.down", "rowIndex": 3, "frameCount": 4, "loop": true, "reviewStatus": "Draft", "frames": [{"index": 0, "sourceRect": {"x": 54, "y": 1368, "w": 316, "h": 258}}, {"index": 1, "sourceRect": {"x": 478, "y": 1373, "w": 317, "h": 253}}, {"index": 2, "sourceRect": {"x": 903, "y": 1358, "w": 316, "h": 268}}, {"index": 3, "sourceRect": {"x": 1324, "y": 1337, "w": 321, "h": 280}}]}, {"id": "walk.up", "label": "Walk.up", "rowIndex": 4, "frameCount": 4, "loop": true, "reviewStatus": "Draft", "frames": [{"index": 0, "sourceRect": {"x": 52, "y": 1791, "w": 320, "h": 259}}, {"index": 1, "sourceRect": {"x": 477, "y": 1808, "w": 319, "h": 242}}, {"index": 2, "sourceRect": {"x": 902, "y": 1798, "w": 319, "h": 252}}, {"index": 3, "sourceRect": {"x": 1325, "y": 1774, "w": 319, "h": 276}}]}, {"id": "walk.right", "label": "Walk.right", "rowIndex": 5, "frameCount": 4, "loop": true, "reviewStatus": "Draft", "frames": [{"index": 0, "sourceRect": {"x": 57, "y": 2201, "w": 327, "h": 255}}, {"index": 1, "sourceRect": {"x": 482, "y": 2201, "w": 326, "h": 255}}, {"index": 2, "sourceRect": {"x": 906, "y": 2201, "w": 326, "h": 255}}, {"index": 3, "sourceRect": {"x": 1330, "y": 2201, "w": 327, "h": 255}}]}, {"id": "walk.left", "label": "Walk.left", "rowIndex": 5, "frameCount": 4, "loop": true, "reviewStatus": "Draft", "flipX": true, "frames": [{"index": 0, "sourceRect": {"x": 57, "y": 2201, "w": 327, "h": 255}}, {"index": 1, "sourceRect": {"x": 482, "y": 2201, "w": 326, "h": 255}}, {"index": 2, "sourceRect": {"x": 906, "y": 2201, "w": 326, "h": 255}}, {"index": 3, "sourceRect": {"x": 1330, "y": 2201, "w": 327, "h": 255}}]}]};
        const imgPath = "../../creatures/slime/tga-topdown-slime-v2-idle-move-cleaned.png";
        
        const canvas = document.getElementById('viewer');
        const ctx = canvas.getContext('2d');
        const select = document.getElementById('seq-select');
        const actionButtons = document.getElementById('action-buttons');
        const playBtn = document.getElementById('play-btn');
        const fpsSlider = document.getElementById('fps-slider');
        const fpsValue = document.getElementById('fps-value');
        
        let img = new Image();
        let isPlaying = true;
        let fps = 10;
        let currentSeq = null;
        let baseLoopSeq = null;
        let isPlayingOneShot = false;
        let currentFrameIdx = 0;
        let lastFrameTime = 0;
        let animationId = null;
        
        if (manifest.animations) {
            manifest.animations.forEach((anim, idx) => {
                if (anim.loop) {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = anim.label || anim.id;
                    select.appendChild(opt);
                } else {
                    const btn = document.createElement('button');
                    btn.textContent = anim.label || anim.id;
                    btn.addEventListener('click', () => playOneShot(idx));
                    actionButtons.appendChild(btn);
                }
            });
        }
        
        function updateCanvasSize() {
            if (!currentSeq || !currentSeq.frames || currentSeq.frames.length === 0) return;
            let maxW = 0, maxH = 0;
            currentSeq.frames.forEach(f => {
                if (f.sourceRect) {
                    maxW = Math.max(maxW, f.sourceRect.w);
                    maxH = Math.max(maxH, f.sourceRect.h);
                }
            });
            canvas.width = maxW || 256;
            canvas.height = maxH || 256;
        }
        
        function setSequence(idx, isOneShot=false) {
            currentSeq = manifest.animations[idx];
            if (!isOneShot) {
                baseLoopSeq = currentSeq;
            }
            currentFrameIdx = 0;
            updateCanvasSize();
            drawFrame();
        }
        
        function playOneShot(idx) {
            isPlayingOneShot = true;
            setSequence(idx, true);
            lastFrameTime = performance.now();
        }
        
        function drawFrame() {
            if (!currentSeq || !currentSeq.frames || currentSeq.frames.length === 0 || !img.complete) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const frame = currentSeq.frames[currentFrameIdx];
            if (!frame || !frame.sourceRect) return;
            const rect = frame.sourceRect;
            
            const dx = (canvas.width - rect.w) / 2;
            const dy = (canvas.height - rect.h) / 2;
            
            ctx.save();
            if (currentSeq.flipX) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(img, rect.x, rect.y, rect.w, rect.h, dx, dy, rect.w, rect.h);
            ctx.restore();
            
            if (currentSeq.symmetry_warning) {
                ctx.strokeStyle = '#ff3c3c';
                ctx.lineWidth = 2;
                ctx.strokeRect(dx, dy, rect.w, rect.h);
                ctx.fillStyle = '#ff3c3c';
                ctx.font = '10px Arial';
                ctx.fillText('ASYMMETRY RISK', dx + 4, dy + rect.h - 4);
            }
        }
        
        function loop(time) {
            if (isPlaying && currentSeq && currentSeq.frames.length > 0) {
                const elapsed = time - lastFrameTime;
                const msPerFrame = 1000 / fps;
                
                if (elapsed >= msPerFrame) {
                    currentFrameIdx++;
                    if (currentFrameIdx >= currentSeq.frames.length) {
                        if (isPlayingOneShot) {
                            isPlayingOneShot = false;
                            currentSeq = baseLoopSeq;
                            currentFrameIdx = 0;
                            updateCanvasSize();
                        } else {
                            currentFrameIdx = currentSeq.loop ? 0 : currentSeq.frames.length - 1;
                        }
                    }
                    drawFrame();
                    lastFrameTime = time;
                }
            }
            animationId = requestAnimationFrame(loop);
        }
        
        select.addEventListener('change', (e) => {
            if (!isPlayingOneShot) {
                setSequence(e.target.value);
                lastFrameTime = performance.now();
            } else {
                baseLoopSeq = manifest.animations[e.target.value];
            }
        });
        
        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? 'Pause' : 'Play';
            if (isPlaying) lastFrameTime = performance.now();
        });
        
        fpsSlider.addEventListener('input', (e) => {
            fps = parseInt(e.target.value);
            fpsValue.textContent = fps;
        });
        
        img.onload = () => {
            if (manifest.animations && manifest.animations.length > 0) {
                let firstLoopIdx = manifest.animations.findIndex(a => a.loop);
                if (firstLoopIdx === -1) firstLoopIdx = 0;
                setSequence(firstLoopIdx);
                
                // Keep select value in sync if a loop exists
                if (select.options.length > 0) {
                    select.value = firstLoopIdx;
                }
                
                lastFrameTime = performance.now();
                animationId = requestAnimationFrame(loop);
            }
        };
        img.onerror = () => {
            ctx.fillStyle = '#ff6e6e';
            ctx.font = '16px Arial';
            ctx.fillText('Failed to load sprite sheet', 20, 40);
            ctx.fillText(imgPath, 20, 60);
        };
        img.src = imgPath;
        
    </script>
</body>
</html>
